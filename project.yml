name: ShuaTiClassroom
options:
  bundleIdPrefix: com.taoshentech
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settingGroups:
  common:
    base:
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1,2"
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
      ENABLE_BITCODE: NO
      CLANG_ENABLE_MODULES: YES
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: Support/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.nuownqyyy886.ct1218
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0.0"

targets:
  ShuaTiClassroom:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    settings:
      groups: [common]
    sources:
      - path: Sources
      - path: Support
        buildPhase: none
    scheme:
      testTargets:
        - ShuaTiClassroomTests

  ShuaTiClassroomTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.taoshentech.shuaticlassroom.tests
    sources:
      - path: Tests
    dependencies:
      - target: ShuaTiClassroom
